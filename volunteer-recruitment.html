<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>選挙対策本部ポータル</title>
    <style>
      :root {
        --bg: #f2eadf;
        --text: #1d1b16;
        --line: rgba(92, 73, 38, 0.16);
        --shadow: 0 18px 48px rgba(72, 54, 21, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(201, 138, 50, 0.24), transparent 28%),
          radial-gradient(circle at top right, rgba(84, 103, 173, 0.18), transparent 26%),
          linear-gradient(180deg, #f8f4ec 0%, #f2eadf 42%, #ece1d0 100%);
      }

      .page {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }

      .topbar {
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
        background: linear-gradient(135deg, #1f2430 0%, #222d44 100%);
        color: #fff;
        padding: 22px;
      }

      .eyebrow {
        margin: 0;
        font-size: 0.72rem;
        letter-spacing: 0.32em;
        font-weight: 700;
        color: rgba(255, 239, 208, 0.84);
      }

      .title {
        margin: 8px 0 0;
        font-size: clamp(1.8rem, 3vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .card {
        margin-top: 16px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: var(--shadow);
        padding: 20px;
      }

      .meta {
        display: grid;
        gap: 8px;
        color: #5f5444;
      }

      .meta strong {
        color: #1f2430;
      }

      .lead {
        margin: 14px 0 0;
        line-height: 1.7;
      }

      .actions {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(31, 36, 48, 0.2);
        border-radius: 999px;
        padding: 10px 16px;
        text-decoration: none;
        color: #1f2430;
        background: #fff;
        font-weight: 700;
      }

      .btn.primary {
        background: linear-gradient(135deg, #1f2430 0%, #222d44 100%);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <p class="eyebrow">ELECTION CONTROL CENTER</p>
        <h1 class="title">選挙対策本部ポータル</h1>
      </header>

      <section class="card">
        <div class="meta">
          <div>選挙区: <strong id="districtName">-</strong></div>
          <div>候補者: <strong id="candidateName">-</strong></div>
          <div>投票日: <strong id="votingDate">-</strong></div>
        </div>
        <p class="lead">このページでボランティア募集に関する案内を行います。必要に応じて応募フォームや募集要項を追加してください。</p>

        <div class="actions">
          <a id="backToBoardBtn" class="btn" href="candidate-board.html">候補者ボードへ戻る</a>
          <a class="btn primary" href="index.html">ポータルへ戻る</a>
        </div>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const districtName = params.get("districtName") || "-";
      const candidateName = params.get("candidateName") || "-";
      const votingDate = params.get("votingDate") || params.get("date") || "-";

      const districtEl = document.getElementById("districtName");
      const candidateEl = document.getElementById("candidateName");
      const votingEl = document.getElementById("votingDate");
      if (districtEl) districtEl.textContent = districtName;
      if (candidateEl) candidateEl.textContent = candidateName;
      if (votingEl) votingEl.textContent = votingDate;

      const backBtn = document.getElementById("backToBoardBtn");
      if (backBtn) {
        backBtn.href = `candidate-board.html?${params.toString()}`;
      }
    </script>
  </body>
</html>
